<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolify • Workspace Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-zinc-100 min-h-screen font-sans">

    <!-- Sidebar Container -->
    <div id="sidebar"></div>

    <!-- Main Content Area -->
    <div class="md:ml-64 p-6 md:p-10 min-h-screen flex flex-col justify-between">
        
        <main class="max-w-5xl mx-auto w-full space-y-8 my-auto">
            
            <!-- Global Dashboard Title & Auth Header -->
            <div class="border-b border-zinc-800 pb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-white uppercase">Today's Overview</h1>
                    <p class="text-xs text-zinc-500 mt-1">Unified Workspace • Tasks & Memory Logs</p>
                </div>

                <!-- SINGLE GLOBAL SIGN-IN / PROFILE BAR -->
                <div id="global-auth-container" class="flex items-center gap-3 bg-zinc-950 border border-zinc-800 p-2 rounded-xl">
                    <button id="google-login-btn" class="bg-white hover:bg-zinc-200 text-black text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2 transition">
                        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                        Sign in with Google
                    </button>

                    <div id="user-profile" class="hidden flex items-center gap-3 px-2">
                        <img id="user-avatar" class="w-7 h-7 rounded-full border border-zinc-700" src="" alt="Avatar">
                        <div class="flex flex-col">
                            <span id="user-name" class="text-xs font-bold text-white leading-none"></span>
                            <span id="user-email" class="text-[10px] text-zinc-500 font-mono truncate max-w-[140px]"></span>
                        </div>
                        <button id="logout-btn" class="ml-2 bg-zinc-900 hover:bg-zinc-800 text-rose-400 border border-zinc-800 text-[11px] font-mono px-2.5 py-1 rounded-md transition">
                            Logout
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                <!-- 1. Pending Tasks Section (Gatividhiya Main Integration) -->
                <section class="bg-zinc-950 border border-zinc-800 rounded-xl p-6 flex flex-col justify-between shadow-2xl">
                    <div>
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-sm font-bold tracking-wider text-white uppercase flex items-center gap-2">
                                <span>📌</span> Work Pending Today
                            </h2>
                            <span id="pending-count" class="text-xs font-mono bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded border border-zinc-700">0 Tasks</span>
                        </div>
                        
                        <!-- Add Task Input -->
                        <form id="task-form" class="flex gap-2 mb-6">
                            <input type="text" id="task-input" placeholder="Add missed task..." 
                                class="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2.5 text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-400">
                            <button type="submit" id="task-add-btn" class="bg-white hover:bg-zinc-200 text-black px-5 py-2.5 rounded-lg text-xs font-bold transition">
                                Add
                            </button>
                        </form>

                        <!-- Task List -->
                        <ul id="task-list" class="space-y-2 max-h-72 overflow-y-auto pr-1">
                            <li class="text-zinc-600 text-xs text-center py-6 font-mono">Loading Gatividhiya tasks...</li>
                        </ul>
                    </div>
                </section>

                <!-- 2. Today's Memory & Notes Writer (Dailymemo) -->
                <section class="bg-zinc-950 border border-zinc-800 rounded-xl p-6 flex flex-col justify-between shadow-2xl">
                    <div>
                        <div class="mb-4">
                            <h2 class="text-sm font-bold tracking-wider text-white uppercase flex items-center gap-2">
                                <span>📝</span> Daily Note & Memory
                            </h2>
                            <p class="text-[11px] text-zinc-500 mt-1">Reflections and logs for today.</p>
                        </div>
                        
                        <textarea id="memory-input" rows="8" placeholder="Sign in with Google to write today's memories..." disabled
                            class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-4 text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-400 resize-none font-mono disabled:opacity-50 disabled:cursor-not-allowed"></textarea>
                    </div>

                    <div class="flex justify-between items-center mt-6 pt-4 border-t border-zinc-900">
                        <span id="save-status" class="text-xs font-mono text-zinc-500">Sign in required</span>
                        <button id="save-memory-btn" disabled class="bg-white hover:bg-zinc-200 text-black px-6 py-2.5 rounded-lg text-xs font-bold transition disabled:opacity-50 disabled:cursor-not-allowed">
                            Save Note
                        </button>
                    </div>
                </section>

            </div>

        </main>

        <!-- Footer -->
        <footer class="mt-12 text-center py-4 text-[11px] text-zinc-600 font-mono border-t border-zinc-900 max-w-5xl mx-auto w-full">
            Toolify • B&W Workspace Engine
        </footer>

    </div>

    <!-- Import Sidebar JS -->
    <script src="sidebar.js"></script>

    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp as initGatividhiya } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore as getGatiFS, collection, addDoc, deleteDoc, doc as gatiDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        import { initializeApp as initMemo } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore as getMemoFS, doc as memoDoc, setDoc, onSnapshot as onMemoSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // -------------------------------------------------------------
        // Firebase Configs
        // -------------------------------------------------------------
        const gatividhiyaConfig = {
            apiKey: "AIzaSyCfOzZdWyPJE4A_Vz_5h1ElS0_m_EXTenw",
            authDomain: "gatividhiya.firebaseapp.com",
            databaseURL: "https://gatividhiya-default-rtdb.firebaseio.com",
            projectId: "gatividhiya",
            storageBucket: "gatividhiya.firebasestorage.app",
            messagingSenderId: "305825266364",
            appId: "1:305825266364:web:b4e7b0921644f88b632eb9"
        };
        const appGatividhiya = initGatividhiya(gatividhiyaConfig, "gatividhiyaApp");
        const dbGatividhiya = getGatiFS(appGatividhiya);

        const dailymemoConfig = {
            apiKey: "AIzaSyDJANDEn9IdMFNEvKClOofHTmX64IsSyqw",
            authDomain: "dailymemo-92398.firebaseapp.com",
            projectId: "dailymemo-92398",
            storageBucket: "dailymemo-92398.firebasestorage.app",
            messagingSenderId: "707078957755",
            appId: "1:707078957755:web:5027f3cac6a4590059579e"
        };
        const appDailymemo = initMemo(dailymemoConfig, "dailymemoApp");
        const dbDailymemo = getMemoFS(appDailymemo);
        const authPrimary = getAuth(appDailymemo);
        const googleProvider = new GoogleAuthProvider();

        // -------------------------------------------------------------
        // UI Elements
        // -------------------------------------------------------------
        const googleLoginBtn = document.getElementById('google-login-btn');
        const userProfile = document.getElementById('user-profile');
        const userAvatar = document.getElementById('user-avatar');
        const userName = document.getElementById('user-name');
        const userEmail = document.getElementById('user-email');
        const logoutBtn = document.getElementById('logout-btn');

        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');
        const pendingCount = document.getElementById('pending-count');

        const memoryInput = document.getElementById('memory-input');
        const saveMemoryBtn = document.getElementById('save-memory-btn');
        const saveStatus = document.getElementById('save-status');

        // Helper function for Local Date Key (YYYY-MM-DD in local time)
        const getLocalTodayKey = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        let currentUserId = null;
        let unsubscribeMemo = null;

        // -------------------------------------------------------------
        // Feature 1: Gatividhiya Tasks (Public Realtime Feed)
        // -------------------------------------------------------------
        // Direct query to match main Gatividhiya repo schema
        const qGatividhiya = query(collection(dbGatividhiya, "pending_tasks"));
        
        onSnapshot(qGatividhiya, (snapshot) => {
            let tasks = [];
            snapshot.forEach((docItem) => {
                tasks.push({ id: docItem.id, ...docItem.data() });
            });

            pendingCount.innerText = `${tasks.length} Tasks`;

            if (tasks.length === 0) {
                taskList.innerHTML = `<li class="text-zinc-600 text-xs text-center py-6 font-mono">No pending tasks found.</li>`;
                return;
            }

            taskList.innerHTML = tasks.map(task => `
                <li class="flex items-center justify-between bg-zinc-900 border border-zinc-800 p-3 rounded-lg">
                    <span class="text-xs text-zinc-200">${escapeHtml(task.text || '')}</span>
                    <button onclick="window.deleteTask('${task.id}')" class="text-zinc-500 hover:text-white text-xs font-mono px-2 py-1 transition">Remove</button>
                </li>
            `).join('');
        }, (error) => {
            console.error("Gatividhiya Listener Error:", error);
            taskList.innerHTML = `<li class="text-rose-400 text-xs text-center py-4 font-mono">Error loading tasks: ${error.message}</li>`;
        });

        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (!text) return;

            try {
                await addDoc(collection(dbGatividhiya, "pending_tasks"), {
                    text: text,
                    createdAt: new Date().toISOString()
                });
                taskInput.value = '';
            } catch (error) {
                console.error("Error adding task: ", error);
                alert("Failed to add task: " + error.message);
            }
        });

        window.deleteTask = async function(id) {
            try {
                await deleteDoc(gatiDoc(dbGatividhiya, "pending_tasks", id));
            } catch (error) {
                console.error("Error deleting task: ", error);
            }
        }

        // -------------------------------------------------------------
        // Feature 2: Dailymemo Notes (Google Auth + Realtime Sync)
        // -------------------------------------------------------------
        googleLoginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(authPrimary, googleProvider);
            } catch (error) {
                console.error("Sign-In Error:", error);
                alert("Sign-In Failed: " + error.message);
            }
        });

        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(authPrimary);
            } catch (error) {
                console.error("Logout Error:", error);
            }
        });

        onAuthStateChanged(authPrimary, (user) => {
            if (user) {
                currentUserId = user.uid;

                // Update UI Profile
                userName.innerText = user.displayName || "User";
                userEmail.innerText = user.email || "";
                userAvatar.src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'U')}&background=18181b&color=fff`;
                
                googleLoginBtn.classList.add('hidden');
                userProfile.classList.remove('hidden');

                // Enable Notes
                memoryInput.disabled = false;
                saveMemoryBtn.disabled = false;
                saveStatus.innerText = "Ready";

                // Listen to Daily Note changes
                listenDailyMemory(currentUserId);

            } else {
                currentUserId = null;

                googleLoginBtn.classList.remove('hidden');
                userProfile.classList.add('hidden');

                memoryInput.value = "";
                memoryInput.disabled = true;
                saveMemoryBtn.disabled = true;
                saveStatus.innerText = "Sign in required";

                if (unsubscribeMemo) unsubscribeMemo();
            }
        });

        function listenDailyMemory(userId) {
            if (unsubscribeMemo) unsubscribeMemo();
            
            const todayKey = getLocalTodayKey();
            const docRef = memoDoc(dbDailymemo, "users", userId, "entries", todayKey);

            // Realtime listener for note content
            unsubscribeMemo = onMemoSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    memoryInput.value = docSnap.data().content || "";
                } else {
                    memoryInput.value = "";
                }
            }, (error) => {
                console.error("Error listening to note:", error);
                saveStatus.innerText = "[Sync Error]";
            });
        }

        saveMemoryBtn.addEventListener('click', async () => {
            if (!currentUserId) return;
            try {
                saveStatus.innerText = "Saving...";
                const todayKey = getLocalTodayKey();
                await setDoc(memoDoc(dbDailymemo, "users", currentUserId, "entries", todayKey), {
                    content: memoryInput.value,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                
                saveStatus.innerText = "[Saved]";
                setTimeout(() => { saveStatus.innerText = "Ready"; }, 2000);
            } catch (error) {
                console.error("Error saving note: ", error);
                saveStatus.innerText = "[Save Error]";
                alert("Save failed: " + error.message);
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
